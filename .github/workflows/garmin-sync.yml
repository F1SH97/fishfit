name: Garmin data sync

# Fetches live Garmin Connect metrics per profile and commits data/<profile>/garmin.json,
# which the dashboard reads at runtime. Auth is token-only, one token secret per
# profile (see scripts/garmin_auth.py). No Garmin email or password is ever stored
# in or referenced by GitHub. A profile with no token is skipped cleanly, so the
# site keeps serving that profile's fixtures.
#
# To add a profile: add its token secret below (GARMINTOKENS_<ID>) and its id to
# the PROFILES list. cjf reuses the original GARMINTOKENS secret.

on:
  schedule:
    - cron: "15 6 * * *"   # daily at 06:15 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

# Prevent overlapping runs from racing on the commit.
concurrency:
  group: garmin-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  PROFILES: "cjf jj"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for any credentials
        id: creds
        env:
          GARMINTOKENS_CJF: ${{ secrets.GARMINTOKENS }}
          GARMINTOKENS_JJ: ${{ secrets.GARMINTOKENS_JJ }}
        run: |
          if [ -n "$GARMINTOKENS_CJF" ] || [ -n "$GARMINTOKENS_JJ" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Garmin token secrets configured — skipping sync. Add GARMINTOKENS (cjf) / GARMINTOKENS_JJ (jj) to enable live data."
          fi

      - name: Set up Python
        if: steps.creds.outputs.has == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.creds.outputs.has == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Sync each profile that has a token
        if: steps.creds.outputs.has == 'true'
        env:
          # One token secret per profile. cjf keeps the original GARMINTOKENS secret.
          GARMINTOKENS_CJF: ${{ secrets.GARMINTOKENS }}
          GARMINTOKENS_JJ: ${{ secrets.GARMINTOKENS_JJ }}
        run: |
          for prof in $PROFILES; do
            var="GARMINTOKENS_$(echo "$prof" | tr '[:lower:]' '[:upper:]')"
            token="${!var}"
            if [ -z "$token" ]; then
              echo "::notice::No token for '$prof' — skipping."
              continue
            fi
            echo "Syncing profile '$prof'…"
            PROFILE="$prof" GARMINTOKENS="$token" python scripts/fetch_garmin.py \
              || echo "::warning::sync failed for '$prof' (leaving its existing data untouched)."
          done

      - name: Commit updated data
        if: steps.creds.outputs.has == 'true'
        run: |
          if git status --porcelain data/ | grep -q .; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): sync Garmin metrics"
            git push
          else
            echo "No data change — nothing to commit."
          fi
